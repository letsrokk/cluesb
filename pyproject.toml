[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cluesb"
version = "0.1.0"
description = "Live macOS USB and display topology diagnostics TUI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["textual>=8.2,<9"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]
standalone = ["pyinstaller==6.21.0"]
lint = ["ruff==0.16.0"]

[project.scripts]
cluesb = "cluesb.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cluesb"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = ["integration: requires macOS host commands"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
